# Step 3 of the plan (#36, brief #39). Three jobs.
#
# The first, runs, copies new Run files and boot summaries from the scheduled
# -runs stage's bucket into smrdotgg/ledgermath-runs and pushes them, derives
# every Series with Method series v1 and every Series of requests with Method
# requests v1, builds the page, keeps the page and both files of Derivations
# as an artifact, builds the data API's static files, checks them against the
# Derivations and against the files the last run that checked its tree kept
# (fetched with this run's token, which may therefore read Actions), keeps
# them as a second artifact, api, for a week, and opens (or comments on) one
# issue when a watched Series has had no Run for 48 hours, the newest price
# file (prices.yml) is more than 48 hours old, or the API bucket's table of
# contents is more than 14 hours old, and sends the maintainer one Telegram
# message each time it writes there. It writes nothing to the API bucket and
# does not publish: its alarm only reads, in a child process killed after 20
# seconds, when that table of contents was last written, and whatever S3
# answers, or the check meets, is a finding the alarm reports, never a failure
# of the job. Its success, its caches and its timing are the same with or
# without publishing.
#
# The second, publish, runs after the first, only when the first succeeded and
# the variable API_BUCKET is set: it takes that run's checked artifact api,
# checks the stage's private API bucket before anything is written, uploads
# the files that changed, and checks what the bucket then holds (ADR-0031). Its
# failure is its own red job; the first job, its caches and its artifact api
# (the next run's baseline, which is chosen by that artifact, not by how the
# run ended) are untouched by it.
#
# The third, site, runs after the second, only when it succeeded and only on
# main: inside the production deploys' concurrency group, it reads the tree
# from the API bucket itself (with the same role, only reading), builds the
# website in site/ from exactly those bytes, checks it, deploys it to Vercel
# production (https://ledgermath.com) and checks the live pages, so the home
# page shows what the public API holds (ADR-0035). Its failure is its own red
# job, and ledgermath.com keeps the build it had until a step deploys.
#
# It needs, in this repository's settings (README, "The Runs repository, the
# Method and the page"):
#   variable RUNS_AWS_ROLE_ARN     the scheduled stage's runsReaderRole output
#   variable RUNS_BUCKET           the scheduled stage's bucket output
#   secret   RUNS_REPO_DEPLOY_KEY  the private half of a deploy key of
#                                  smrdotgg/ledgermath-runs with write access
#   secret   TELEGRAM_BOT_TOKEN    the bot the alarm's Telegram message is sent
#   secret   TELEGRAM_CHAT_ID      from, and the maintainer's chat with it;
#                                  while either is unset, no message is sent
# and, once the scheduled stage is deployed with an API bucket (README, "The
# data API", "The API bucket"):
#   variable API_BUCKET            the scheduled stage's apiBucket output; while
#                                  it is not set, the publish job is skipped and
#                                  the alarm does not read the bucket
# and, for the site job, the three site.yml uses (README, "Where it is
# deployed"), which in this workflow only that job's deploy step sees (a test
# holds that):
#   secret   VERCEL_TOKEN          a Vercel token scoped to the project ledgermath
#   variable VERCEL_ORG_ID         the Vercel team's ID
#   variable VERCEL_PROJECT_ID     the project's ID
# infra/runs/stages.ts names the scheduled stage; the README ("Moving the
# schedule to the production account") says when the variables change.
name: runs

on:
  schedule:
    # Once after each round of boots, never during one. Rounds start at 04:10,
    # 10:10, 16:10 and 22:10 UTC, a box every ten minutes to :50
    # (schedule.json). A launch more than ten minutes late is refused
    # (infra/runs/launch-event.ts), and the reaper, every five minutes, asks EC2
    # to end any box older than 50 minutes (infra/runs/reap-boxes.ts), so by
    # those limits the last box of a round has ended by HH+1:55; the run is
    # scheduled ten minutes after. A test holds the times to schedule.json and
    # those limits (tests/runs-workflow.test.ts). What that does not promise: a
    # tree can still hold part of a round when a run starts during one (started
    # by hand, or a scheduled run started, or left waiting for its runner, more
    # than four hours late), or when a box outlives the limits (the reaper asks
    # for a box to be ended and does not confirm it was). The API's own words
    # allow for that: a month file changes when a Run or a missing boot summary
    # arrives late. GitHub often starts a scheduled run
    # late (7 to 15 minutes at the top of the hour on 2026-11-24): a late start
    # of under four hours cuts the same round, later.
    - cron: "5 0,6,12,18 * * *"
  # new_baseline is a human's declaration, by hand, that this run's data API
  # tree is a new baseline: there is no earlier tree of its layout to compare
  # it with (the first build after LAYOUT was raised, or the last tree kept
  # expired). It is the only source of the check's --allow-no-previous;
  # nothing automatic grants it, so a scheduled run with no such tree fails.
  workflow_dispatch:
    inputs:
      new_baseline:
        description: "Declare this run's data API tree a new baseline: past months are not compared (no published Series or Run may be missing all the same)"
        type: boolean
        default: false
      # alarm_drill makes the alarm, after its ordinary pass, post one comment
      # on its issue (opening it if none is open) saying it is a drill and
      # that nothing is wrong, and send one Telegram message saying the same,
      # so the maintainer sees whether its notification arrives (README,
      # "Turning it on", step 0). It reads nothing and changes no state the
      # alarm reads back. Only by hand: a scheduled run has no inputs. The
      # publish job never sees it.
      alarm_drill:
        description: "Drill the alarm: post one comment on the alarm issue, and send one Telegram message, saying it is a drill; nothing else changes, publishing is untouched"
        type: boolean
        default: false

# Nothing for the workflow as a whole: each job says what it may do.
permissions: {}

# No concurrency for the workflow as a whole: each job holds its own group.
# The first job holds runs, the group prices.yml holds for its whole run, so
# the two never push to the Runs repository at once; it holds it exactly as
# long as the workflow did before the publish job existed. GitHub's groups
# are the repository's, shared by jobs and workflow runs alike: "only a
# single job or workflow using the same concurrency group will run at a
# time" (docs.github.com, "Control the concurrency of workflows and jobs").
# The publish job holds api-bucket alone, and the site job
# site-deploy-production, which site.yml's production deploy holds too
# (below).

jobs:
  runs:
    name: copy the Runs, derive, build the page and the data API, check for stale Series
    runs-on: ubuntu-24.04
    # Room for a run that must reduce every stream again: when a change to the
    # Methods' reducing code gives their records new keys (methods/records.ts),
    # the next run fetches and reduces every Run's stdout once more (11,758 in
    # under two minutes from inside AWS on 2026-11-27; a GitHub runner reads
    # the bucket across the internet, slower) and growing with them. The
    # derive step has 40 of these minutes, so a long one is stopped with time
    # left to save what it made, and the next run fetches only what this one
    # did not.
    timeout-minutes: 60
    # One at a time with every other runs job and every prices run; of those
    # waiting, GitHub keeps only the newest (cancel-in-progress false: the one
    # running is never cancelled).
    concurrency:
      group: runs
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # the OIDC token AWS exchanges for the role
      issues: write # the alarm
      actions: read # the data API's files an earlier run kept, for the check
    env:
      RUNS_BUCKET: ${{ vars.RUNS_BUCKET }}
    steps:
      # The whole history, so the alarm can be told when schedule.json last
      # changed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # Bun's package cache in the job's temporary directory, which the runner
      # empties for every job.
      - run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache

      - name: AWS credentials for the bucket, through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.RUNS_AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Check out the Runs repository
        id: runs-repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: smrdotgg/ledgermath-runs
          ref: main
          ssh-key: ${{ secrets.RUNS_REPO_DEPLOY_KEY }}
          path: ledgermath-runs

      - name: Copy new Run files and boot summaries from the bucket
        id: copy
        run: bun scripts/copy-runs.ts --bucket "$RUNS_BUCKET" ledgermath-runs

      - name: Commit and push them to the Runs repository
        id: push
        working-directory: ledgermath-runs
        run: |
          for part in runs boots; do
            if [ -d "$part" ]; then git add -- "$part"; fi
          done
          if git diff --cached --quiet; then
            echo "nothing new in the bucket"
            exit 0
          fi
          added=$(git diff --cached --name-only | wc -l)
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Add $added files from the bucket"
          git push origin HEAD:main

      # The dump blobs fetched so far, and each stream's reduced record per
      # Method (methods/records.ts), never the stdout blobs themselves: a
      # stream is fetched only for a Run no Method has a record of yet, and
      # let go once reduced. The prefix is new with the records, so the caches
      # of stdout blobs kept before (blobs-…) are not restored. Restored here,
      # from the newest cache of any earlier run, and saved by the step after
      # the derive step, however that step ended, under this attempt's key.
      - name: Keep the dump blobs and the streams' reduced records
        id: derive-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/blobs
            .cache/records
          key: derive-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: derive-

      # Each Method runs on its own: when one fails, derive.ts still writes the
      # other's Derivations, a note in place of the failed one's
      # (page/<name>.failed.json), and exits 1. The page is then built from
      # what there is and says which part is missing and why, the artifact is
      # kept, and the run still ends as failed, so the failure is seen.
      #
      # Its own 40 minutes, inside the job's 60: a derive step that runs long
      # is stopped there, and the job still has 20 minutes for the save after
      # it (always() runs a step after a failure or a cancellation, but not once
      # the job itself is out of time) and for the page and the alarm. A cold
      # rebuild of 11,758 streams took under two minutes from inside AWS on
      # 2026-11-27, and the retries of one read pause 31.5 seconds at most.
      - name: Derive every Series (Method series v1) and every Series of requests (Method requests v1)
        id: derive
        timeout-minutes: 40
        run: >-
          bun scripts/derive.ts --runs ledgermath-runs --bucket "$RUNS_BUCKET"
          --cache .cache/blobs --records .cache/records
          --out page/derivations.json --requests-out page/requests-derivations.json

      # What the derive step fetched and reduced, saved as soon as it ends,
      # however it ended: succeeded, failed, stopped at its own 40 minutes, or
      # cancelled (always()). Each blob and each record is
      # written whole, under a temporary name and then renamed, as it is made,
      # so a derive step stopped part way leaves only whole files, and the next
      # run reads back what this one fetched instead of starting over (#77).
      # Never when the step did not start, which leaves nothing new. The key is
      # this attempt's, so a run attempted again saves its own work too.
      - name: Save the dump blobs and the streams' reduced records, however the derive step ended
        if: ${{ always() && (steps.derive.outcome == 'success' || steps.derive.outcome == 'failure' || steps.derive.outcome == 'cancelled') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/blobs
            .cache/records
          key: ${{ steps.derive-cache.outputs.cache-primary-key }}

      - name: Build the page
        id: page
        if: ${{ !cancelled() && (steps.derive.outcome == 'success' || steps.derive.outcome == 'failure') }}
        run: bun scripts/build-page.ts page/derivations.json page/index.html --requests page/requests-derivations.json

      - name: Keep the page and the Derivations
        if: ${{ !cancelled() && (steps.derive.outcome == 'success' || steps.derive.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: page
          path: page/
          if-no-files-found: error

      # The data API's tree of static files (ADR-0030), cut from both files of
      # Derivations and the Runs repository's price files, laid out as it will
      # be served. Only when both Methods succeeded, so the tree never lacks a
      # Method's part. The check reads back what was written: every file
      # against its schema, every link, every Series both ways, every Run file
      # a point cites with its sha256; and every month file against the tree
      # an earlier run checked and kept, which it may differ from only for the
      # four causes ADR-0030 gives (rule 9). Only a checked tree is kept, as
      # the artifact api, for a week (the next runs need only the latest).
      - name: Build the data API's files
        id: api
        if: ${{ !cancelled() && steps.derive.outcome == 'success' }}
        run: >-
          bun scripts/build-api.ts --derivations page/derivations.json
          --requests-derivations page/requests-derivations.json --runs ledgermath-runs --out api

      # The artifact api of the latest run on main created before this one
      # that kept one, which a run does only when its tree passed the check:
      # chosen by that artifact, never by how the run ended, so a run whose
      # publish job failed is a baseline and one whose check failed is not.
      # That run may not have ended (its publish job still going): an
      # artifact can be downloaded as soon as it is kept.
      # There may be none: no such run, an artifact that expired. The script
      # says which in the step's summary, and decides nothing. A tree that
      # could not be fetched fails this step, and the check does not run: it
      # is not a tree that does not exist.
      - name: Fetch the data API's files the last run that checked its tree kept
        id: api-previous
        if: ${{ !cancelled() && steps.api.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bun scripts/previous-api.ts --repository "$GITHUB_REPOSITORY" --workflow runs.yml
          --branch main --run-id "$GITHUB_RUN_ID" --tree api --out api-previous

      # A previous tree of this layout is compared strictly, always. With none,
      # or one of another layout, the check fails unless a human started this
      # run with the input new_baseline, the only source of
      # --allow-no-previous; the check's summary says which.
      - name: Check the data API's files
        id: api-check
        if: ${{ !cancelled() && steps.api.outcome == 'success' && steps.api-previous.outcome == 'success' }}
        run: >-
          bun scripts/check-api.ts --tree api --derivations page/derivations.json
          --requests-derivations page/requests-derivations.json --runs ledgermath-runs
          --previous api-previous ${{ inputs.new_baseline == true && '--allow-no-previous' || '' }}

      - name: Keep the data API's files
        if: ${{ !cancelled() && steps.api-check.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api
          path: api/
          if-no-files-found: error
          retention-days: 7

      # Even when the copy, the Method or the page failed. When the copy or
      # its push failed, the Runs repository may be behind the bucket, and the
      # alarm says so at the top of anything it writes. A Series that has
      # never had a Run counts only once schedule.json has been unchanged for
      # 48 hours: the alarm is told when main last changed it, the commit time
      # of the last commit on main's first-parent line that touched it (a
      # merge commit, not the branch commit it brought in). It also reports a
      # newest price file more than 48 hours old; with no price file at all,
      # only once the prices workflow has existed for 48 hours: it is told when
      # that was, the commit time of the first commit on main's first-parent
      # line that touched .github/workflows/prices.yml. And, with API_BUCKET
      # set, it reads when the API bucket's v1/index.json was last written, by
      # S3's clock, and reports it more than 14 hours old, a bucket with no
      # table of contents, or one it cannot read (ADR-0032). That check runs
      # in a child process the alarm kills after 20 seconds, with the role's
      # existing read of the bucket; nothing it does or meets fails this step
      # or changes what the alarm says of the Series and price files. With the
      # input alarm_drill, the alarm also posts one drill comment on its
      # issue, which changes nothing it reads back.
      #
      # Whenever the alarm writes on GitHub (the issue opened, a comment, the
      # all-clear, a drill), or had something to post and could not, it also
      # sends the maintainer one Telegram message, last of all (ADR-0033). It
      # is sent from inside the alarm, in this step: GitHub starts no workflow
      # for an issue or comment made with the workflow's own token
      # (docs.github.com, "Triggering a workflow from a workflow"), so no
      # workflow on issue events could do it. The two Telegram secrets are in
      # this step's environment and nowhere else in any workflow (a test holds
      # that), and this workflow never runs for a pull request. The check's
      # child never sees them. The message is given up after 16 seconds; one
      # not sent is a warning, never a failure of this step, so the publish
      # job is never skipped for it; with the secrets unset (a fork), a notice.
      - name: Check for watched Series with no Run, and price files, for 48 hours
        if: ${{ !cancelled() && steps.runs-repository.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPY: ${{ steps.copy.outcome == 'success' && steps.push.outcome == 'success' && 'succeeded' || 'failed' }}
          API_BUCKET: ${{ vars.API_BUCKET }}
          ALARM_DRILL: ${{ inputs.alarm_drill == true && 'yes' || 'no' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          changed="$(git log -1 --first-parent --format=%cI -- schedule.json)"
          prices_since="$(git log --first-parent --reverse --format=%cI -- .github/workflows/prices.yml | sed -n 1p)"
          bun scripts/alarm.ts --runs ledgermath-runs --copy "$COPY" --schedule-changed-at "$changed" --prices-since "$prices_since" \
            --api-bucket "$API_BUCKET" --drill "$ALARM_DRILL"

  # The checked tree, to the stage's private API bucket (ADR-0031), after the
  # first job and apart from it: only when the first job succeeded (so its tree
  # passed the check and was kept as the artifact api) and API_BUCKET names the
  # bucket (the stage's apiBucket output, set after the deploy that made it).
  # The upload first checks the bucket (scripts/upload-api.ts --preflight):
  # every key it holds must be in the tree, and nothing in it written by a
  # later run; then writes only the files whose SHA-256 or headers differ,
  # schemas first, then month files and price files, Series files, the list
  # and the table of contents, each phase whole before the next; it deletes
  # nothing; and, last, makes the table of contents record this run even when
  # nothing else changed. The bucket grants nothing to anyone but, while the
  # public API is on (infra/runs/public-blobs.ts, PUBLIC_API, "on" as merged),
  # its CloudFront distribution, so what this uploads is served publicly at
  # https://api.ledgermath.com. A failure is this job's alone, red, its summary naming the phase
  # and the keys; the next run repairs the bucket. When publishing stops,
  # however it stops, the table of contents is not written again, and the
  # first job's alarm in a later run says so once it is more than 14 hours
  # old. This job never sees the input alarm_drill.
  #
  # It holds api-bucket, not runs: the next run's first job may start while it
  # uploads. Two publish jobs never run at once; of those waiting, GitHub keeps
  # only the newest and cancels the older, whose tree is older. Any other order
  # (an older run's job run again by hand, a job that started waiting later
  # than a newer one) is refused by the upload itself, which writes nothing
  # when the bucket records a later run than this one (OlderTree). That guard
  # reads the bucket before writing, not during: two uploads overlapping in
  # time could still leave the older tree written last. The group is what
  # keeps uploads apart, so an upload by hand goes through this job (a re-run,
  # or a dispatch), never from elsewhere while a publish may be running.
  publish:
    name: publish the data API's checked files to the private API bucket
    needs: runs
    if: ${{ needs.runs.result == 'success' && vars.API_BUCKET != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # the scripts
      id-token: write # the OIDC token AWS exchanges for the role
    concurrency:
      group: api-bucket
      cancel-in-progress: false
    env:
      API_BUCKET: ${{ vars.API_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # As in the first job.
      - run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache

      - name: The data API's files this run checked
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api
          path: api

      # Before anything is uploaded: one file of each kind the tree holds,
      # asked for at its public address (the tree's own). Only the edge's own
      # 404, which it answers to an address of no served shape, stops the job:
      # the deployed edge does not serve that kind yet, and production-runs is
      # to be deployed first. Any other answer, the public address being down,
      # slow or unreachable included, lets the upload go on, so the public
      # address failing never stops a publish. Nothing is asked of a tree the
      # public API does not serve (scripts/lib/api-edge.ts).
      - name: Check that the public edge serves every kind of file in the tree
        run: bun scripts/check-api-edge.ts --tree api

      - name: AWS credentials for the API bucket, through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.RUNS_AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Check the API bucket before anything is written
        run: bun scripts/upload-api.ts --tree api --bucket "$API_BUCKET" --run "$GITHUB_RUN_ID" --preflight

      - name: Upload the data API's files to the API bucket
        run: bun scripts/upload-api.ts --tree api --bucket "$API_BUCKET" --run "$GITHUB_RUN_ID"

      # What the whole bucket holds is exactly the tree just uploaded: the same
      # files, each with its SHA-256, size and headers, and nothing else; and
      # the table of contents records this run, the latest any object records.
      - name: Check that the API bucket holds the data API's files
        run: bun scripts/check-api-bucket.ts --tree api --bucket "$API_BUCKET" --run "$GITHUB_RUN_ID"

  # The home page, rebuilt from what the API bucket holds and deployed to Vercel
  # production, after the publish job and apart from it (ADR-0035): only when
  # that job succeeded (never when it failed, was skipped or was cancelled),
  # and only on main (a scheduled run, or one by hand on main).
  #
  # The rule: production deploys take turns, and each builds the page from
  # what the bucket holds when its turn comes. This job and site.yml's
  # deploy-production hold one concurrency group, site-deploy-production, each
  # for its whole job: one runs at a time, a running one is never cancelled,
  # and every one that arrives meanwhile waits (queue: max). Inside the group,
  # in this order, this job checks out main as it is now (never this run's
  # commit, which main may have left), reads the tree from the API bucket
  # itself (scripts/read-api-tree.ts: the bucket, not the edge, whose cache can
  # be five minutes behind, and not an artifact), builds and checks the site
  # from exactly those bytes, deploys, and checks the live site. So the page
  # shows what the bucket, and so the public API, holds at that moment, whatever
  # was run again and whichever artifact a job took; and since each deploy
  # reads the bucket afresh, the last one to run deploys the newest tree. One
  # that gets its turn late reads the same bucket and deploys the same page
  # again. No job asks whether its tree is the newest.
  #
  # A failure (reading the bucket, the build, its checks, the deploy, the live
  # check) is this job's own, red, with a notice naming the step and saying
  # what ledgermath.com serves: before the deploy step, the build it had; after
  # a failed deploy step, not confirmed (Vercel may have moved production
  # before the receipt was read); after one that succeeded, the new build.
  # Nothing else tells the maintainer yet (#87). The first job, its caches and
  # the publish job are untouched by it.
  site:
    name: rebuild the site from what the API bucket holds, and deploy it to production
    needs: publish
    if: ${{ needs.publish.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # main's sources
      id-token: write # the OIDC token AWS exchanges for the role, with which this job only reads the API bucket
    concurrency:
      group: site-deploy-production
      queue: max
    steps:
      # main as it is now, inside the group: the site's sources, and the
      # scripts this job runs. Not this run's commit, which main may have left.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # Bun's package cache in the job's temporary directory, as in the first job.
      - name: The repository's packages
        id: packages
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache
        run: bun install --frozen-lockfile

      # The publish job's role. It may read and write the API bucket's v1/*;
      # this job only reads (one GET per file, scripts/read-api-tree.ts). The
      # keys are not put in the job's environment, where every later step (the
      # installs, the build, the deploy) would hold them: they are this step's
      # outputs, handed to the read step alone.
      - name: AWS credentials for the API bucket, through OIDC
        id: credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.RUNS_AWS_ROLE_ARN }}
          aws-region: us-east-2
          output-env-credentials: false
          output-credentials: true

      # The table of contents and the two files its links give, from the bucket
      # API_BUCKET names: of one publication (an upload by another run can be
      # under way, so a set that disagrees is read again), written all or none.
      # The only step that holds the role's keys; the Region is the one the
      # credentials were taken for.
      - name: The data API's files as the API bucket holds them now
        id: tree
        env:
          API_BUCKET: ${{ vars.API_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ steps.credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.credentials.outputs.aws-session-token }}
        run: bun scripts/read-api-tree.ts --bucket "$API_BUCKET" --region us-east-2 --out "$RUNNER_TEMP/tree"

      - name: The site's packages
        id: site-packages
        working-directory: site
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache
        run: bun install --frozen-lockfile

      - name: Build the site from those files into site/dist/client
        id: build
        working-directory: site
        run: bun run build --tree "$RUNNER_TEMP/tree"

      - name: Each page holds its fixed words outside its scripts, links and loads stay inside the site or the API, the budget holds, and every figure is the tree's
        id: check
        working-directory: site
        env:
          LEDGERMATH_TREE: ${{ runner.temp }}/tree
        run: bun run check

      - name: The site carries the notices of the code it ships (THIRD-PARTY-NOTICES.md, section 3)
        id: notices
        working-directory: site
        run: cmp public/third-party-notices.txt dist/client/third-party-notices.txt

      - name: The Vercel CLI, at the version site/deploy/package.json pins
        id: cli
        working-directory: site/deploy
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache
        run: bun install --frozen-lockfile

      # The only step of this workflow that sees the Vercel token or the
      # project's IDs.
      - name: Deploy as prebuilt files (production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: site/deploy/deploy.sh site/dist/client production >"$RUNNER_TEMP/deployment.json"

      - name: The deployment's URL, in the job summary
        id: summary
        run: |
          url=$(jq -er '.url' "$RUNNER_TEMP/deployment.json")
          newest=$(jq -r '.newest_run_started_at' "$RUNNER_TEMP/tree/v1/index.json")
          {
            echo "### Site deployed to Vercel: production"
            echo
            echo "- Deployment: $url"
            echo "- Production: https://ledgermath.com/"
            echo "- Tree: as the API bucket held it when this job read it; newest Run $newest"
            echo "- Site: main at $(git rev-parse HEAD)"
          } >>"$GITHUB_STEP_SUMMARY"
          echo "$url"

      - name: https://ledgermath.com/ and /docs/ answer 200 with their fixed words in their HTML, and /docs/ as Markdown, to Accept text/markdown too, and llms.txt
        id: live
        working-directory: site
        run: bun scripts/check-live.ts https://ledgermath.com/

      # Which step failed, and what ledgermath.com serves now, as an error the
      # run's page shows at the top, and in the job summary. Before the deploy
      # step, nothing was deployed. If the deploy step itself failed, Vercel may
      # have taken the deployment and moved production to it before deploy.sh
      # read its receipt, so what production serves is not confirmed. After a
      # deploy step that succeeded (its receipt read and checked), the new build
      # is served.
      - name: Say which step failed, and what ledgermath.com serves
        if: failure()
        env:
          PACKAGES: ${{ steps.packages.outcome }}
          CREDENTIALS: ${{ steps.credentials.outcome }}
          TREE: ${{ steps.tree.outcome }}
          SITE_PACKAGES: ${{ steps.site-packages.outcome }}
          BUILD: ${{ steps.build.outcome }}
          CHECK: ${{ steps.check.outcome }}
          NOTICES: ${{ steps.notices.outcome }}
          CLI: ${{ steps.cli.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          SUMMARY: ${{ steps.summary.outcome }}
          LIVE: ${{ steps.live.outcome }}
        run: |
          failed="the checkout of main, or setting up Bun"
          for step in PACKAGES CREDENTIALS TREE SITE_PACKAGES BUILD CHECK NOTICES CLI DEPLOY SUMMARY LIVE; do
            [ "${!step}" = failure ] || continue
            case $step in
              PACKAGES) failed="installing the repository's packages" ;;
              CREDENTIALS) failed="taking AWS credentials for the API bucket" ;;
              TREE) failed="reading the data API's files from the API bucket" ;;
              SITE_PACKAGES) failed="installing the site's packages" ;;
              BUILD) failed="building the site from the bucket's files" ;;
              CHECK) failed="bun run check, against the bucket's files" ;;
              NOTICES) failed="comparing the notices" ;;
              CLI) failed="installing the Vercel CLI" ;;
              DEPLOY) failed="the deploy to Vercel" ;;
              SUMMARY) failed="reading the deployment's URL" ;;
              LIVE) failed="the live check of https://ledgermath.com/" ;;
            esac
            break
          done
          if [ "$DEPLOY" = success ]; then
            serves="The deploy succeeded, so ledgermath.com serves the new build; a step after it failed."
          elif [ "$DEPLOY" = failure ]; then
            serves="What ledgermath.com serves is not confirmed: Vercel may have moved production to the new deployment before its receipt was read. Check the project's deployments in Vercel."
          else
            serves="Nothing was deployed: ledgermath.com serves the build it had."
          fi
          echo "::error title=Site not rebuilt::The step that failed: ${failed}. ${serves}"
          { echo "### Site not rebuilt"; echo; echo "The step that failed: ${failed}. ${serves}"; } >>"$GITHUB_STEP_SUMMARY"
