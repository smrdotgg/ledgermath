# Step 3 of the plan (#36, brief #39). Copies new Run files and boot summaries
# from the -runs stage's bucket into smrdotgg/ledgermath-runs and pushes them,
# derives every Series with Method version 1, builds the page, keeps the page
# and the Derivations as an artifact, and opens (or comments on) one issue when
# a watched Series has had no Run for 48 hours.
#
# It needs, in this repository's settings (README, "The Runs repository, the
# Method and the page"):
#   variable RUNS_AWS_ROLE_ARN     the stage's runsReaderRole output
#   variable RUNS_BUCKET           the stage's bucket output
#   secret   RUNS_REPO_DEPLOY_KEY  the private half of a deploy key of
#                                  smrdotgg/ledgermath-runs with write access
name: runs

on:
  schedule:
    - cron: "40 22 * * *" # half an hour after the 22:10 boot
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC token AWS exchanges for the role
  issues: write # the alarm

concurrency:
  group: runs
  cancel-in-progress: false

jobs:
  runs:
    name: copy the Runs, derive, build the page, check for stale Series
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUNS_BUCKET: ${{ vars.RUNS_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - name: AWS credentials for the bucket, through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.RUNS_AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Check out the Runs repository
        id: runs-repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: smrdotgg/ledgermath-runs
          ref: main
          ssh-key: ${{ secrets.RUNS_REPO_DEPLOY_KEY }}
          path: ledgermath-runs

      - name: Copy new Run files and boot summaries from the bucket
        id: copy
        run: bun scripts/copy-runs.ts --bucket "$RUNS_BUCKET" ledgermath-runs

      - name: Commit and push them to the Runs repository
        id: push
        working-directory: ledgermath-runs
        run: |
          for part in runs boots; do
            if [ -d "$part" ]; then git add -- "$part"; fi
          done
          if git diff --cached --quiet; then
            echo "nothing new in the bucket"
            exit 0
          fi
          added=$(git diff --cached --name-only | wc -l)
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Add $added files from the bucket"
          git push origin HEAD:main

      - name: Keep the blobs fetched so far
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/blobs
          key: blobs-${{ github.run_id }}
          restore-keys: blobs-

      - name: Derive every Series (Method version 1)
        run: bun scripts/derive.ts --runs ledgermath-runs --bucket "$RUNS_BUCKET" --cache .cache/blobs --out page/derivations.json

      - name: Build the page
        run: bun scripts/build-page.ts page/derivations.json page/index.html

      - name: Keep the page and the Derivations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: page
          path: page/
          if-no-files-found: error

      # Even when the copy, the Method or the page failed. When the copy or
      # its push failed, the Runs repository may be behind the bucket, and the
      # alarm says so at the top of anything it writes.
      - name: Check for watched Series with no Run for 48 hours
        if: ${{ !cancelled() && steps.runs-repository.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPY: ${{ steps.copy.outcome == 'success' && steps.push.outcome == 'success' && 'succeeded' || 'failed' }}
        run: bun scripts/alarm.ts --runs ledgermath-runs --copy "$COPY"
