# Builds the website in site/ from the data API's tree as published now
# (site/scripts/fetch-tree.ts fetches the files the pages read from
# https://api.ledgermath.com) and checks what the build wrote with `bun run
# check`: each page holds its fixed words (site/src/pages.text.ts) in its body
# outside any script, so the prerender ran and it reads with JavaScript off;
# nothing in the output refers to a file it lacks or loads from another
# origin; every link goes inside the site, under https://api.ledgermath.com/,
# or to an address site/src/pages.text.ts names whole (OUTSIDE_LINKS);
# each page is under its size budget (site/scripts/check-output.ts); and every
# figure on the pages is the tree's, exactly (site/scripts/check-figures.ts).
# The same commands work locally inside site/. Keeps the built site as the
# artifact `site`, which a preview deploys.
#
# Production is not deployed from that artifact. On a push to main or a run by
# hand on main, `deploy-production`, inside the production deploys'
# concurrency group, builds the site again from what the API bucket holds when
# its turn comes, checks it, deploys it to ledgermath.com as prebuilt files
# (Vercel builds nothing; site/deploy/deploy.sh) and checks the live pages
# (site/scripts/check-live.ts); unless main has moved on, in the files this
# workflow's push trigger lists, since the run's commit (site/deploy/fresh.ts),
# when it skips the deploy and passes, and the newer commit's own run, waiting
# in the same queue, deploys after it or already has. The runs workflow's site
# job, which rebuilds the site after every publish, deploys production in the
# same queue by the same rule (runs.yml; README, "Where it is deployed";
# ADR-0035). A pull request from a branch of this repository, or a run by hand
# on another branch, gets a preview deployment from `deploy-preview`. A pull
# request from a fork gets no secrets, so its run skips both deploy jobs and
# still passes; nothing a fork's code controls ever sees VERCEL_TOKEN, and no
# pull request is given AWS credentials.
name: site

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    # site/deploy/fresh.ts reads this list, as what the site is built from.
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: type-check, build and check the site
    runs-on: ${{ vars.LEDGERMATH_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run typecheck
      - name: Test the data module, the build, the checks and the deploy scripts against their fixtures
        run: bun test
      - name: The data API's tree as published now, the files the pages read
        run: bun scripts/fetch-tree.ts "$RUNNER_TEMP/tree"
      - name: Build from that tree into dist/client
        run: bun run build
        env:
          LEDGERMATH_TREE: ${{ runner.temp }}/tree
      - name: Each page holds its fixed words outside its scripts, links and loads stay inside the site or the API, the budget holds, and every figure is the tree's
        run: bun run check
        env:
          LEDGERMATH_TREE: ${{ runner.temp }}/tree
      - name: The site carries the notices of the code it ships (THIRD-PARTY-NOTICES.md, section 3)
        run: cmp public/third-party-notices.txt dist/client/third-party-notices.txt
      - name: Keep the built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/dist/client/
          if-no-files-found: error

  # Production: a push to main, or a run by hand on main. A pull request
  # never reaches this job, so the fork rule below does not arise here, and
  # the role it assumes trusts main alone (infra/runs/github-role.ts).
  deploy-production:
    name: build the site from the API bucket and deploy it to Vercel (production)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ${{ vars.LEDGERMATH_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the OIDC token AWS exchanges for the role, with which this job only reads the API bucket
    # Production deploys run one at a time, and a running one is never
    # cancelled mid-upload. `queue: max` keeps every job that arrives while
    # another runs (up to 100) waiting in the group, instead of GitHub's
    # default of one waiting job that the next arrival cancels; so none is
    # dropped, and each takes its turn. The runs workflow's site job holds the
    # same group. Each reads the API bucket when its turn comes, so the last to
    # run deploys the newest tree. Jobs arrive in the order their builds
    # finish, not their commits' (and a re-run arrives whenever it is started),
    # so each first checks that main has not moved on (the step "Production
    # goes ahead only if..."), and skips the deploy if it has.
    concurrency:
      group: site-deploy-production
      queue: max
    env:
      TARGET: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # main as it is now, inside the concurrency group: all of its history's
      # commits and trees, and of its files only the workflow (a sparse
      # checkout fetches no other blob). The checkout above cannot serve: when
      # main has moved since the run began, it points origin/main at the run's
      # commit. Fetched with the job's GITHUB_TOKEN, as the checkout above is;
      # no Vercel credential is involved.
      - name: main as it is now
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          path: main-now
          fetch-depth: 0
          sparse-checkout: .github/workflows/site.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Production goes ahead only if main has not moved on in what the site is built from
        id: fresh
        working-directory: main-now
        run: |
          set +e
          verdict=$(bun ../site/deploy/fresh.ts "$GITHUB_SHA" refs/remotes/origin/main)
          status=$?
          set -e
          echo "$verdict"
          case $status in
            0) echo deploy=true >>"$GITHUB_OUTPUT" ;;
            3)
              echo deploy=false >>"$GITHUB_OUTPUT"
              { echo "### Site not deployed to Vercel: production"; echo; echo "$verdict"; } >>"$GITHUB_STEP_SUMMARY"
              ;;
            *) exit "$status" ;;
          esac
      # Every step from here is skipped when that step said not to deploy.
      - name: The repository's packages
        if: steps.fresh.outputs.deploy == 'true'
        run: bun install --frozen-lockfile
      # The runs workflow's role, which it may assume from main alone. It may
      # read and write the API bucket's v1/*; this job only reads. The keys are
      # this step's outputs, not the job's environment, so only the read step
      # holds them, as in the runs workflow's site job.
      - name: AWS credentials for the API bucket, through OIDC
        id: credentials
        if: steps.fresh.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.RUNS_AWS_ROLE_ARN }}
          aws-region: us-east-2
          output-env-credentials: false
          output-credentials: true
      # Inside the group, as the runs workflow's site job does: the bucket, not
      # the edge, whose cache can be five minutes behind.
      - name: The data API's files as the API bucket holds them now
        if: steps.fresh.outputs.deploy == 'true'
        env:
          API_BUCKET: ${{ vars.API_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ steps.credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.credentials.outputs.aws-session-token }}
        run: bun scripts/read-api-tree.ts --bucket "$API_BUCKET" --region us-east-2 --out "$RUNNER_TEMP/tree"
      - name: The site's packages
        if: steps.fresh.outputs.deploy == 'true'
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Build the site from those files into site/dist/client
        if: steps.fresh.outputs.deploy == 'true'
        working-directory: site
        run: bun run build --tree "$RUNNER_TEMP/tree"
      - name: Each page holds its fixed words outside its scripts, links and loads stay inside the site or the API, the budget holds, and every figure is the tree's
        if: steps.fresh.outputs.deploy == 'true'
        working-directory: site
        env:
          LEDGERMATH_TREE: ${{ runner.temp }}/tree
        run: bun run check
      - name: The site carries the notices of the code it ships (THIRD-PARTY-NOTICES.md, section 3)
        if: steps.fresh.outputs.deploy == 'true'
        working-directory: site
        run: cmp public/third-party-notices.txt dist/client/third-party-notices.txt
      - name: The Vercel CLI, at the version site/deploy/package.json pins
        if: steps.fresh.outputs.deploy == 'true'
        working-directory: site/deploy
        run: bun install --frozen-lockfile
      - name: Deploy as prebuilt files (${{ env.TARGET }})
        if: steps.fresh.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: site/deploy/deploy.sh site/dist/client "$TARGET" >"$RUNNER_TEMP/deployment.json"
      - name: The deployment's URL, in the job summary
        if: steps.fresh.outputs.deploy == 'true'
        run: |
          url=$(jq -er '.url' "$RUNNER_TEMP/deployment.json")
          newest=$(jq -r '.newest_run_started_at' "$RUNNER_TEMP/tree/v1/index.json")
          {
            echo "### Site deployed to Vercel: $TARGET"
            echo
            echo "- Deployment: $url"
            echo "- Production: https://ledgermath.com/"
            echo "- Commit: $GITHUB_SHA"
            echo "- Tree: as the API bucket held it when this job read it; newest Run $newest"
          } >>"$GITHUB_STEP_SUMMARY"
          echo "$url"
      - name: https://ledgermath.com/ and /docs/ answer 200 with their fixed words (src/pages.text.ts) in their HTML
        if: steps.fresh.outputs.deploy == 'true'
        working-directory: site
        run: bun scripts/check-live.ts https://ledgermath.com/

  # A preview: a pull request from a branch of this repository, or a run by
  # hand on a branch other than main. It deploys the build job's artifact,
  # built from the public API's tree, with no freshness check and no live check.
  deploy-preview:
    name: deploy the built site to Vercel (preview)
    needs: build
    # A fork's pull request is not given the repository's secrets: skip the
    # job rather than fail it. Same-repository branches are pushed by people
    # with write access, who could read the secret anyway.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !(github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
    runs-on: ${{ vars.LEDGERMATH_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    # A newer preview of the same pull request or branch cancels the one
    # before.
    concurrency:
      group: site-deploy-${{ github.ref }}
      cancel-in-progress: true
    env:
      TARGET: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: The Vercel CLI, at the version site/deploy/package.json pins
        working-directory: site/deploy
        run: bun install --frozen-lockfile
      - name: The site the build job built and checked
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site
      - name: Deploy as prebuilt files (${{ env.TARGET }})
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: site/deploy/deploy.sh "$RUNNER_TEMP/site" "$TARGET" >"$RUNNER_TEMP/deployment.json"
      - name: The deployment's URL, in the job summary
        run: |
          url=$(jq -er '.url' "$RUNNER_TEMP/deployment.json")
          {
            echo "### Site deployed to Vercel: $TARGET"
            echo
            echo "- Deployment: $url"
            echo "- A preview: opening it needs a Vercel login (Vercel Authentication)"
            echo "- Commit: $GITHUB_SHA"
          } >>"$GITHUB_STEP_SUMMARY"
          echo "$url"
