# Builds the placeholder website in site/ and checks what the build wrote with
# `bun run check` (site/scripts/check-output.ts): index.html holds the page's
# text (site/src/App.text.ts) in its body outside any script, so the prerender
# ran and the page reads with JavaScript off, and nothing in the output refers
# to a file it lacks or loads from another origin. The same commands work
# locally inside site/. Keeps the built site as the artifact `site`.
#
# Then one deploy job puts that artifact on Vercel as prebuilt files (Vercel
# builds nothing; site/deploy/deploy.sh). On a push to main or a run by hand on
# main, `deploy-production` deploys production, ledgermath.com, and checks the
# live page (site/scripts/check-live.ts), unless main has moved on, in the
# files this workflow's push trigger lists, since the run's commit
# (site/deploy/fresh.ts): then this one skips the deploy and passes, and the
# newer commit's own run, waiting in the same queue, deploys after it or
# already has. A pull request from a branch of this repository, or a run by
# hand on another branch, gets a preview deployment from `deploy-preview`.
# A pull request from a fork gets no secrets, so its run skips both deploy
# jobs and still passes; nothing a fork's code controls ever sees
# VERCEL_TOKEN.
name: site

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    # site/deploy/fresh.ts reads this list, as what the site is built from.
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: type-check, build and check the site
    runs-on: ${{ vars.LEDGERMATH_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run typecheck
      - name: Test the output check against its fixtures
        run: bun test
      - name: Build, then prerender into dist/client
        run: bun run build
      - name: index.html holds the page's text (src/App.text.ts) outside its scripts, and the output refers to no file it lacks
        run: bun run check
      - name: The site carries the notices of the code it ships (THIRD-PARTY-NOTICES.md, section 3)
        run: cmp public/third-party-notices.txt dist/client/third-party-notices.txt
      - name: Keep the built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/dist/client/
          if-no-files-found: error

  # Production: a push to main, or a run by hand on main. A pull request
  # never reaches this job, so the fork rule below does not arise here.
  deploy-production:
    name: deploy the built site to Vercel (production)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ${{ vars.LEDGERMATH_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    # Production deploys run one at a time, and a running one is never
    # cancelled mid-upload. `queue: max` keeps every job that arrives while
    # another runs (up to 100) waiting in the group, instead of GitHub's
    # default of one waiting job that the next arrival cancels; so none is
    # dropped, and each takes its turn. Jobs arrive in the order their builds
    # finish, not their commits' (and a re-run arrives whenever it is
    # started), so each first checks that main has not moved on (the step
    # "Production goes ahead only if...") and skips the deploy if it has.
    concurrency:
      group: site-deploy-production
      queue: max
    env:
      TARGET: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # main as it is now, inside the concurrency group: all of its history's
      # commits and trees, and of its files only the workflow (a sparse
      # checkout fetches no other blob). The checkout above cannot serve: when
      # main has moved since the run began, it points origin/main at the run's
      # commit. Fetched with the job's GITHUB_TOKEN, as the checkout above is;
      # no Vercel credential is involved.
      - name: main as it is now
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          path: main-now
          fetch-depth: 0
          sparse-checkout: .github/workflows/site.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Production goes ahead only if main has not moved on in what the site is built from
        id: fresh
        working-directory: main-now
        run: |
          set +e
          verdict=$(bun ../site/deploy/fresh.ts "$GITHUB_SHA" refs/remotes/origin/main)
          status=$?
          set -e
          echo "$verdict"
          case $status in
            0) echo deploy=true >>"$GITHUB_OUTPUT" ;;
            3)
              echo deploy=false >>"$GITHUB_OUTPUT"
              { echo "### Site not deployed to Vercel: production"; echo; echo "$verdict"; } >>"$GITHUB_STEP_SUMMARY"
              ;;
            *) exit "$status" ;;
          esac
      # Every step from here is skipped when that step said not to deploy.
      - name: The Vercel CLI, at the version site/deploy/package.json pins
        if: steps.fresh.outputs.deploy == 'true'
        working-directory: site/deploy
        run: bun install --frozen-lockfile
      - name: The site the build job built and checked
        if: steps.fresh.outputs.deploy == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site
      - name: Deploy as prebuilt files (${{ env.TARGET }})
        if: steps.fresh.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: site/deploy/deploy.sh "$RUNNER_TEMP/site" "$TARGET" >"$RUNNER_TEMP/deployment.json"
      - name: The deployment's URL, in the job summary
        if: steps.fresh.outputs.deploy == 'true'
        run: |
          url=$(jq -er '.url' "$RUNNER_TEMP/deployment.json")
          {
            echo "### Site deployed to Vercel: $TARGET"
            echo
            echo "- Deployment: $url"
            echo "- Production: https://ledgermath.com/"
            echo "- Commit: $GITHUB_SHA"
          } >>"$GITHUB_STEP_SUMMARY"
          echo "$url"
      - name: https://ledgermath.com/ answers 200 with the page's text (src/App.text.ts) in its HTML
        if: steps.fresh.outputs.deploy == 'true'
        working-directory: site
        run: bun scripts/check-live.ts https://ledgermath.com/

  # A preview: a pull request from a branch of this repository, or a run by
  # hand on a branch other than main. Its steps are the production job's
  # without the freshness check and the live check.
  deploy-preview:
    name: deploy the built site to Vercel (preview)
    needs: build
    # A fork's pull request is not given the repository's secrets: skip the
    # job rather than fail it. Same-repository branches are pushed by people
    # with write access, who could read the secret anyway.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !(github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
    runs-on: ${{ vars.LEDGERMATH_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    # A newer preview of the same pull request or branch cancels the one
    # before.
    concurrency:
      group: site-deploy-${{ github.ref }}
      cancel-in-progress: true
    env:
      TARGET: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: The Vercel CLI, at the version site/deploy/package.json pins
        working-directory: site/deploy
        run: bun install --frozen-lockfile
      - name: The site the build job built and checked
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site
      - name: Deploy as prebuilt files (${{ env.TARGET }})
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: site/deploy/deploy.sh "$RUNNER_TEMP/site" "$TARGET" >"$RUNNER_TEMP/deployment.json"
      - name: The deployment's URL, in the job summary
        run: |
          url=$(jq -er '.url' "$RUNNER_TEMP/deployment.json")
          {
            echo "### Site deployed to Vercel: $TARGET"
            echo
            echo "- Deployment: $url"
            echo "- A preview: opening it needs a Vercel login (Vercel Authentication)"
            echo "- Commit: $GITHUB_SHA"
          } >>"$GITHUB_STEP_SUMMARY"
          echo "$url"
