# Builds the website in site/ from a tree of the data API and checks what the
# build wrote with `bun run check`. For production (a push to main, or a run by
# hand on main) the tree is the one the runs workflow published last, taken by
# its identity, RUN/ARTIFACT: the run and the very artifact api its publish job
# uploaded, downloaded by the artifact's id (site/deploy/published.ts). For a
# preview it is the tree as
# published now (site/scripts/fetch-tree.ts fetches the files the pages read
# from https://api.ledgermath.com). `bun run check`: each page holds its fixed
# words (site/src/pages.text.ts) in its body
# outside any script, so the prerender ran and it reads with JavaScript off;
# nothing in the output refers to a file it lacks or loads from another
# origin; every link goes inside the site or under https://api.ledgermath.com/;
# each page is under its size budget (site/scripts/check-output.ts); and every
# figure on the pages is the tree's, exactly (site/scripts/check-figures.ts).
# The same commands work locally inside site/. Keeps the built site as the
# artifact `site`.
#
# Then one deploy job puts that artifact on Vercel as prebuilt files (Vercel
# builds nothing; site/deploy/deploy.sh). On a push to main or a run by hand on
# main, `deploy-production` deploys production, ledgermath.com, and checks the
# live page (site/scripts/check-live.ts), unless what it would deploy is no
# longer current when its turn comes: main has moved on, in the files this
# workflow's push trigger lists, since the run's commit (site/deploy/fresh.ts),
# or the tree the build took is no longer the newest published, by its
# identity (site/deploy/published.ts). Then this one skips the deploy and
# passes, and the newer commit's own run, or the newer tree's site job, waiting in the same
# queue, deploys after it or already has. The runs workflow's site job, which
# rebuilds the site after every publish, deploys production in the same queue
# and by the same rule (runs.yml; README, "Where it is deployed"; ADR-0035). A
# pull request from a branch of this repository, or a run by
# hand on another branch, gets a preview deployment from `deploy-preview`.
# A pull request from a fork gets no secrets, so its run skips both deploy
# jobs and still passes; nothing a fork's code controls ever sees
# VERCEL_TOKEN.
name: site

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    # site/deploy/fresh.ts reads this list, as what the site is built from.
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: type-check, build and check the site
    runs-on: ${{ vars.LEDGERMATH_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # production: the runs workflow's record, and the artifact api of its newest publish
    # The identity of the tree a production build is built from, RUN/ARTIFACT
    # (the run of runs.yml that published it and the artifact api its publish
    # job uploaded), for the deploy job's check; empty for a preview.
    outputs:
      tree: ${{ steps.published.outputs.tree }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run typecheck
      - name: Test the data module, the build, the checks and the deploy scripts against their fixtures
        run: bun test
      # Production is built from the tree the runs workflow published last, not
      # from the live API, whose cache can serve the tree before for five
      # minutes after an upload. The tree is taken by its identity, RUN/ARTIFACT,
      # and downloaded by the artifact's id, never by its name; the identity is
      # the job's output, so the deploy job can tell whether a newer tree has
      # been published since. The artifact is kept for a week; when it has
      # expired, the build fails (README, "Where it is deployed").
      - name: The tree the runs workflow published last, by its identity (production)
        id: published
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(bun deploy/published.ts newest --repository "$GITHUB_REPOSITORY")
          bun deploy/published.ts download "$tree" --repository "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/tree"
          echo "tree=$tree" >>"$GITHUB_OUTPUT"
      - name: The data API's tree as published now, the files the pages read (previews)
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: bun scripts/fetch-tree.ts "$RUNNER_TEMP/tree"
      - name: Build from that tree into dist/client
        run: bun run build
        env:
          LEDGERMATH_TREE: ${{ runner.temp }}/tree
      - name: Each page holds its fixed words outside its scripts, links and loads stay inside the site or the API, the budget holds, and every figure is the tree's
        run: bun run check
        env:
          LEDGERMATH_TREE: ${{ runner.temp }}/tree
      - name: The site carries the notices of the code it ships (THIRD-PARTY-NOTICES.md, section 3)
        run: cmp public/third-party-notices.txt dist/client/third-party-notices.txt
      - name: Keep the built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/dist/client/
          if-no-files-found: error

  # Production: a push to main, or a run by hand on main. A pull request
  # never reaches this job, so the fork rule below does not arise here.
  deploy-production:
    name: deploy the built site to Vercel (production)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ${{ vars.LEDGERMATH_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # which runs of runs.yml have published
    # Production deploys run one at a time, and a running one is never
    # cancelled mid-upload. `queue: max` keeps every job that arrives while
    # another runs (up to 100) waiting in the group, instead of GitHub's
    # default of one waiting job that the next arrival cancels; so none is
    # dropped, and each takes its turn. The runs workflow's site job holds the
    # same group, so its deploys after each publish take turns with these.
    # Jobs arrive in the order their builds finish, not their commits' (and a
    # re-run arrives whenever it is started), so each first checks that main
    # has not moved on and that the tree its build took is still the newest
    # published (the two steps "Production goes ahead only if..."), and skips
    # the deploy if either is not so.
    concurrency:
      group: site-deploy-production
      queue: max
    env:
      TARGET: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # main as it is now, inside the concurrency group: all of its history's
      # commits and trees, and of its files only the workflow (a sparse
      # checkout fetches no other blob). The checkout above cannot serve: when
      # main has moved since the run began, it points origin/main at the run's
      # commit. Fetched with the job's GITHUB_TOKEN, as the checkout above is;
      # no Vercel credential is involved.
      - name: main as it is now
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          path: main-now
          fetch-depth: 0
          sparse-checkout: .github/workflows/site.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Production goes ahead only if main has not moved on in what the site is built from
        id: fresh
        working-directory: main-now
        run: |
          set +e
          verdict=$(bun ../site/deploy/fresh.ts "$GITHUB_SHA" refs/remotes/origin/main)
          status=$?
          set -e
          echo "$verdict"
          case $status in
            0) echo deploy=true >>"$GITHUB_OUTPUT" ;;
            3)
              echo deploy=false >>"$GITHUB_OUTPUT"
              { echo "### Site not deployed to Vercel: production"; echo; echo "$verdict"; } >>"$GITHUB_STEP_SUMMARY"
              ;;
            *) exit "$status" ;;
          esac
      # The tree, as the step above checks the sources. If the tree the build
      # took, by its identity RUN/ARTIFACT, is no longer the newest published
      # (a later run, or a later attempt of the same run, has published
      # another), the newer tree's site job deploys main's site with it after
      # this job, or already has: it started after that tree was published, so
      # after the build took its own and after this run's commit was on main.
      # Exit 0: deploy; 3: skip; anything else fails the job.
      - name: Production goes ahead only if the tree the build took is still the newest published
        id: newest
        if: steps.fresh.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ needs.build.outputs.tree }}
        run: |
          set +e
          verdict=$(bun site/deploy/published.ts check "$TREE" --repository "$GITHUB_REPOSITORY")
          status=$?
          set -e
          echo "$verdict"
          case $status in
            0) echo deploy=true >>"$GITHUB_OUTPUT" ;;
            3)
              echo deploy=false >>"$GITHUB_OUTPUT"
              { echo "### Site not deployed to Vercel: production"; echo; echo "$verdict"; } >>"$GITHUB_STEP_SUMMARY"
              ;;
            *) exit "$status" ;;
          esac
      # Every step from here is skipped when either step said not to deploy:
      # the second runs only when the first said to.
      - name: The Vercel CLI, at the version site/deploy/package.json pins
        if: steps.newest.outputs.deploy == 'true'
        working-directory: site/deploy
        run: bun install --frozen-lockfile
      - name: The site the build job built and checked
        if: steps.newest.outputs.deploy == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site
      - name: Deploy as prebuilt files (${{ env.TARGET }})
        if: steps.newest.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: site/deploy/deploy.sh "$RUNNER_TEMP/site" "$TARGET" >"$RUNNER_TEMP/deployment.json"
      - name: The deployment's URL, in the job summary
        if: steps.newest.outputs.deploy == 'true'
        env:
          TREE: ${{ needs.build.outputs.tree }}
        run: |
          url=$(jq -er '.url' "$RUNNER_TEMP/deployment.json")
          {
            echo "### Site deployed to Vercel: $TARGET"
            echo
            echo "- Deployment: $url"
            echo "- Production: https://ledgermath.com/"
            echo "- Commit: $GITHUB_SHA"
            echo "- Tree: $TREE (a run of runs.yml, and the artifact api its publish job uploaded)"
          } >>"$GITHUB_STEP_SUMMARY"
          echo "$url"
      - name: https://ledgermath.com/ and /docs/ answer 200 with their fixed words (src/pages.text.ts) in their HTML
        if: steps.newest.outputs.deploy == 'true'
        working-directory: site
        run: bun scripts/check-live.ts https://ledgermath.com/

  # A preview: a pull request from a branch of this repository, or a run by
  # hand on a branch other than main. Its steps are the production job's
  # without the freshness check and the live check.
  deploy-preview:
    name: deploy the built site to Vercel (preview)
    needs: build
    # A fork's pull request is not given the repository's secrets: skip the
    # job rather than fail it. Same-repository branches are pushed by people
    # with write access, who could read the secret anyway.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !(github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
    runs-on: ${{ vars.LEDGERMATH_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    # A newer preview of the same pull request or branch cancels the one
    # before.
    concurrency:
      group: site-deploy-${{ github.ref }}
      cancel-in-progress: true
    env:
      TARGET: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: The Vercel CLI, at the version site/deploy/package.json pins
        working-directory: site/deploy
        run: bun install --frozen-lockfile
      - name: The site the build job built and checked
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site
      - name: Deploy as prebuilt files (${{ env.TARGET }})
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: site/deploy/deploy.sh "$RUNNER_TEMP/site" "$TARGET" >"$RUNNER_TEMP/deployment.json"
      - name: The deployment's URL, in the job summary
        run: |
          url=$(jq -er '.url' "$RUNNER_TEMP/deployment.json")
          {
            echo "### Site deployed to Vercel: $TARGET"
            echo
            echo "- Deployment: $url"
            echo "- A preview: opening it needs a Vercel login (Vercel Authentication)"
            echo "- Commit: $GITHUB_SHA"
          } >>"$GITHUB_STEP_SUMMARY"
          echo "$url"
