# Checks the build and the record, off the box. No measured Run goes through
# Docker: the scratch container only shows that the binary runs alone.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scratch:
    name: every static build runs alone in a FROM scratch container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: AWS-LC's source archive, as benchmarks/harness/c/vendor/aws-lc.lock pins it (http_get links it statically)
        run: benchmarks/harness/c/vendor/fetch-aws-lc.sh "$RUNNER_TEMP/aws-lc.tar.gz"

      - name: Every static build in schedule.json, and http_get against a local stand-in for S3, runs as the only file in a scratch container, once per parameter set, and its stream is valid
        env:
          AWS_LC_ARCHIVE: ${{ runner.temp }}/aws-lc.tar.gz
          AWS_LC_JOBS: "4"
        run: python3 scripts/check-scratch.py

      - name: Build memory_read dynamic
        run: |
          make -C benchmarks/memory_read BUILD=dynamic
          file benchmarks/memory_read/build/*/memory_read

      - name: The same container refuses the dynamic build, so the check has teeth
        run: |
          docker build -q -t lm-memory-read-dynamic -f - benchmarks/memory_read/build/dynamic <<'EOF'
          FROM scratch
          COPY memory_read /bench
          ENTRYPOINT ["/bench"]
          EOF
          if docker run --rm lm-memory-read-dynamic --quick; then
            echo "the dynamic build ran without its shared libraries"
            exit 1
          fi

  test:
    name: bun test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: AWS-LC's source archive, for http_get's tests
        run: benchmarks/harness/c/vendor/fetch-aws-lc.sh "$RUNNER_TEMP/aws-lc.tar.gz"
      - run: bun test
        env:
          AWS_LC_ARCHIVE: ${{ runner.temp }}/aws-lc.tar.gz
          AWS_LC_JOBS: "4"
          LM_HTTP_GET_REQUIRED: "1"
